<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập & Đăng ký — Vườn Ươm Ớt Con IoT</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <main class="auth-container">

    <div class="auth-card">
      <!-- Header -->
      <header class="auth-header">
        <div class="auth-logo-badge" aria-hidden="true">🌱</div>
        <h1 class="auth-title">Vườn Ươm Ớt Con IoT</h1>
        <p class="auth-subtitle">Cổng xác thực người dùng & quản trị hệ thống (G0 v0.1)</p>
      </header>

      <!-- Tabs: Đăng nhập vs Đăng ký -->
      <nav class="auth-tabs" role="tablist" aria-label="Chuyển đổi đăng nhập và đăng ký">
        <button id="tab-login" class="auth-tab-btn active" role="tab" aria-selected="true" aria-controls="form-login">
          Đăng nhập
        </button>
        <button id="tab-register" class="auth-tab-btn" role="tab" aria-selected="false" aria-controls="form-register">
          Đăng ký tài khoản
        </button>
      </nav>

      <!-- Alert thông báo lỗi / thành công -->
      <div id="auth-alert" class="auth-alert" role="alert">
        <span id="auth-alert-icon">⚠️</span>
        <span id="auth-alert-msg">Thông báo</span>
      </div>

      <!-- FORM 1: ĐĂNG NHẬP -->
      <form id="form-login" role="tabpanel" aria-labelledby="tab-login">
        <div class="form-group">
          <label for="login-username" class="form-label">
            Tên đăng nhập
          </label>
          <input 
            type="text" 
            id="login-username" 
            name="username" 
            class="form-input" 
            placeholder="Ví dụ: admin hoặc user" 
            autocomplete="username" 
            required
          >
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">
            Mật khẩu
          </label>
          <input 
            type="password" 
            id="login-password" 
            name="password" 
            class="form-input" 
            placeholder="Nhập mật khẩu của bạn" 
            autocomplete="current-password" 
            required
          >
        </div>

        <div style="margin-top: var(--space-6);">
          <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%;">
            🔑 Đăng nhập hệ thống
          </button>
        </div>

        <!-- Hộp tài khoản demo nạp sẵn từ CSDL -->
        <div class="demo-accounts-box">
          <div class="demo-accounts-title">⚡ Điền nhanh tài khoản thử nghiệm (Seed CSDL)</div>
          <div class="demo-buttons-grid">
            <button type="button" class="btn-demo-quick" id="btn-quick-admin" title="Điền tài khoản Admin">
              <span>🛡️ Quản trị viên</span>
              <small>admin / admin123</small>
            </button>
            <button type="button" class="btn-demo-quick" id="btn-quick-user" title="Điền tài khoản Kỹ thuật viên">
              <span>👤 Kỹ thuật viên</span>
              <small>user / user123</small>
            </button>
          </div>
        </div>
      </form>

      <!-- FORM 2: ĐĂNG KÝ -->
      <form id="form-register" role="tabpanel" aria-labelledby="tab-register" style="display: none;">
        <div class="form-group">
          <label for="reg-username" class="form-label">
            Tên đăng nhập <span style="color: var(--color-coral-strong);">*</span>
          </label>
          <input 
            type="text" 
            id="reg-username" 
            name="username" 
            class="form-input" 
            placeholder="Tối thiểu 3 ký tự (ví dụ: kythuatvien01)" 
            autocomplete="username" 
            minlength="3" 
            required
          >
          <span class="form-hint">Dùng để đăng nhập vào hệ thống</span>
        </div>

        <div class="form-group">
          <label for="reg-fullname" class="form-label">
            Họ và tên hiển thị <span style="color: var(--color-coral-strong);">*</span>
          </label>
          <input 
            type="text" 
            id="reg-fullname" 
            name="full_name" 
            class="form-input" 
            placeholder="Ví dụ: Nguyễn Văn An" 
            required
          >
        </div>

        <div class="form-group">
          <label for="reg-password" class="form-label">
            Mật khẩu <span style="color: var(--color-coral-strong);">*</span>
          </label>
          <input 
            type="password" 
            id="reg-password" 
            name="password" 
            class="form-input" 
            placeholder="Tối thiểu 6 ký tự" 
            autocomplete="new-password" 
            minlength="6" 
            required
          >
        </div>

        <div class="form-group">
          <label for="reg-role" class="form-label">
            Phân quyền tài khoản
          </label>
          <select id="reg-role" name="role" class="form-select">
            <option value="user" selected>👤 Kỹ thuật viên (user) — Xem số đo, lịch sử & quy tắc</option>
            <option value="admin">🛡️ Quản trị viên (admin) — Toàn quyền thêm, sửa, xóa quy tắc</option>
          </select>
          <span class="form-hint">Tài khoản admin có quyền truy cập Trang quản trị</span>
        </div>

        <div style="margin-top: var(--space-6);">
          <button type="submit" id="btn-register-submit" class="btn btn-primary" style="width: 100%;">
            ✨ Đăng ký tài khoản
          </button>
        </div>
      </form>
    </div>

    <!-- Link quay lại trang chính -->
    <div class="auth-back-link">
      <a href="index.html">
        <span>← Quay về Dashboard theo dõi vườn ươm</span>
      </a>
    </div>

  </main>

  <script type="module">
    import { authService } from './js/auth.js';
    import { loadRuntimeConfig } from './js/config.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await loadRuntimeConfig();

      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const authAlert = document.getElementById('auth-alert');
      const authAlertMsg = document.getElementById('auth-alert-msg');
      const authAlertIcon = document.getElementById('auth-alert-icon');
      const btnLoginSubmit = document.getElementById('btn-login-submit');
      const btnRegisterSubmit = document.getElementById('btn-register-submit');

      // Điền nhanh demo
      const btnQuickAdmin = document.getElementById('btn-quick-admin');
      const btnQuickUser = document.getElementById('btn-quick-user');
      const loginUserInput = document.getElementById('login-username');
      const loginPassInput = document.getElementById('login-password');

      function showAlert(msg, isSuccess = false) {
        authAlert.className = isSuccess ? 'auth-alert success' : 'auth-alert error';
        authAlertIcon.textContent = isSuccess ? '✅' : '⚠️';
        authAlertMsg.textContent = msg;
      }

      function hideAlert() {
        authAlert.className = 'auth-alert';
        authAlert.style.display = 'none';
      }

      // Kiểm tra nếu đã đăng nhập và hợp lệ thì gợi ý hoặc chuyển hướng
      const currentUser = authService.getUser();
      if (authService.isAuthenticated() && currentUser) {
        showAlert(`Bạn đang đăng nhập với tài khoản: ${currentUser.full_name} (${currentUser.role}). Đang chuyển hướng...`, true);
        setTimeout(() => {
          if (currentUser.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 1200);
      }

      // Switch Tab
      tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('active');
        tabLogin.setAttribute('aria-selected', 'true');
        tabRegister.classList.remove('active');
        tabRegister.setAttribute('aria-selected', 'false');
        formLogin.style.display = 'block';
        formRegister.style.display = 'none';
        hideAlert();
      });

      tabRegister.addEventListener('click', () => {
        tabRegister.classList.add('active');
        tabRegister.setAttribute('aria-selected', 'true');
        tabLogin.classList.remove('active');
        tabLogin.setAttribute('aria-selected', 'false');
        formRegister.style.display = 'block';
        formLogin.style.display = 'none';
        hideAlert();
      });

      // Quick buttons
      if (btnQuickAdmin) {
        btnQuickAdmin.addEventListener('click', () => {
          loginUserInput.value = 'admin';
          loginPassInput.value = 'admin123';
          hideAlert();
        });
      }

      if (btnQuickUser) {
        btnQuickUser.addEventListener('click', () => {
          loginUserInput.value = 'user';
          loginPassInput.value = 'user123';
          hideAlert();
        });
      }

      // Xử lý submit Login
      formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();
        const username = loginUserInput.value.trim();
        const password = loginPassInput.value.trim();

        btnLoginSubmit.disabled = true;
        btnLoginSubmit.textContent = '⏳ Đang xác thực...';

        try {
          const res = await authService.login(username, password);
          showAlert(`Đăng nhập thành công! Xin chào ${res.user.full_name}.`, true);

          setTimeout(() => {
            const redirectParam = new URLSearchParams(window.location.search).get('redirect');
            if (redirectParam) {
              window.location.href = redirectParam;
            } else if (res.user.role === 'admin') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 800);
        } catch (err) {
          showAlert(err.message || 'Lỗi đăng nhập. Vui lòng thử lại.');
        } finally {
          btnLoginSubmit.disabled = false;
          btnLoginSubmit.textContent = '🔑 Đăng nhập hệ thống';
        }
      });

      // Xử lý submit Register
      formRegister.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();
        const username = document.getElementById('reg-username').value.trim();
        const full_name = document.getElementById('reg-fullname').value.trim();
        const password = document.getElementById('reg-password').value.trim();
        const role = document.getElementById('reg-role').value;

        btnRegisterSubmit.disabled = true;
        btnRegisterSubmit.textContent = '⏳ Đang tạo tài khoản...';

        try {
          const res = await authService.register({ username, password, full_name, role });
          showAlert(`Tạo tài khoản '${username}' thành công! Đang chuyển hướng...`, true);

          setTimeout(() => {
            if (res.user && res.user.role === 'admin') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 1000);
        } catch (err) {
          showAlert(err.message || 'Đăng ký thất bại. Vui lòng kiểm tra lại thông tin.');
        } finally {
          btnRegisterSubmit.disabled = false;
          btnRegisterSubmit.textContent = '✨ Đăng ký tài khoản';
        }
      });
    });
  </script>

</body>
</html>
